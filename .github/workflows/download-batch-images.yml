name: Download batch product images
on:
  push:
    paths:
      - '.github/workflows/download-batch-images.yml'
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download first image of each product
        shell: python
        run: |
          import json, urllib.request
          from pathlib import Path
          root=Path('.image-source/20261104_232714')
          for item in json.loads((root/'products.json').read_text()):
              with urllib.request.urlopen(item['url'],timeout=90) as r:
                  data=r.read()
              if not data.startswith(b'\x89PNG'):
                  raise ValueError('Unexpected image type: '+item['id'])
              (root/(item['id']+'.png')).write_bytes(data)
              print(item['id'],len(data))
      - name: Save downloaded images
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .image-source/20261104_232714
          if ! git diff --cached --quiet; then
            git commit -m 'Download batch source product images'
            git push
          fi
