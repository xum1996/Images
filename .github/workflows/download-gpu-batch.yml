name: Download graphics card batch
on:
  push:
    paths:
      - '.github/workflows/download-gpu-batch.yml'
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download originals
        shell: python
        run: |
          import concurrent.futures, json, urllib.request, time
          from pathlib import Path
          root=Path('.image-source/20261105_011006')
          def download(item):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(item['url'],timeout=90) as r:
                          data=r.read()
                      if not (data.startswith(b'\x89PNG') or data.startswith(b'\xff\xd8') or data.startswith(b'RIFF')):
                          raise ValueError('Unexpected image content')
                      (root/(item['id']+'.img')).write_bytes(data)
                      print(item['id'],len(data),flush=True)
                      return
                  except Exception:
                      if attempt==2: raise
                      time.sleep(2)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              list(pool.map(download,json.loads((root/'products.json').read_text())))
      - name: Save originals
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .image-source/20261105_011006
          if ! git diff --cached --quiet; then
            git commit -m 'Download graphics card batch originals'
            git push
          fi
