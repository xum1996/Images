name: Download requested product image
on:
  push:
    paths:
      - '.github/workflows/download-product-image.yml'
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download first product image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p '20261104_223048/2117982607366557697'
          curl --fail --location --retry 2 --max-time 90 'https://sc04.alicdn.com/kf/H02fada7ffda9440c8ca7a3d75515cd5ae.png' --output '20261104_223048/2117982607366557697/主图1_原图.png'
          file '20261104_223048/2117982607366557697/主图1_原图.png'
      - name: Save original image to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '20261104_223048/2117982607366557697/主图1_原图.png'
          if ! git diff --cached --quiet; then
            git commit -m 'Download original product image'
            git push
          fi
